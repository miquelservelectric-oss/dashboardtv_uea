<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>UE Alcúdia · Dashboard TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
  .pitch{background:
    radial-gradient(circle at 50% 50%,transparent 0 118px,rgba(255,255,255,.05) 118px 122px,transparent 122px),
    linear-gradient(90deg,transparent calc(50% - 2px),rgba(255,255,255,.05) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),
    repeating-linear-gradient(90deg,#0b1f17 0 160px,#0d251b 160px 320px)}
  .fade{animation:fade .7s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .bar{animation:bar 20s linear both}
  @keyframes bar{from{width:0}to{width:100%}}
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel">
const { useState, useEffect } = React;
const EDIT = location.hash === "#editar";   // añade #editar al enlace para abrir el editor
addEventListener("hashchange", () => location.reload());

const CLUB = "UE Alcúdia", CAMPO_CASA = "Estadi Municipal d'Alcúdia", POR_PAGINA = 7;
const RS = "2026-11-07", RD = "2026-11-08", NS = "2026-11-14", ND = "2026-11-15";
/* Datos de EJEMPLO; en cuanto guardes desde el editor se usan los tuyos (datos.json) */
const TUPLAS = [
 ["A","TERCERA FEDERACION",["CD Pollença",1,3,1,RD],["CD Binissalem",0,ND,"17:00"]],
 ["B","DIVISIÓN DE HONOR MALLORCA",["CE Sa Pobla",0,1,1,RD],["CD Artà",1,ND,"12:00"]],
 ["A","JUVENIL LIGA NACIONAL",["CE Campos",1,2,0,RS],["SD Santanyí",0,NS,"16:00"]],
 ["B","JUVENIL PRIMERA REGIONAL MALLORCA",["CD Muro",0,0,2,RS],["CE Esporles",1,NS,"18:00"]],
 ["C","JUVENIL PRIMERA REGIONAL MALLORCA",["CE Andratx",1,4,2,RS],["CD Felanitx",0,ND,"10:00"]],
 ["A","CADETE PREFERENTE MALLORCA",["CD Manacor",0,2,1,RS],["CD Pollença",1,NS,"16:30"]],
 ["B","CADETE PRIMERA REGIONAL MALLORCA",["CD Llosetense",1,1,3,RS],["CE Consell",0,NS,"15:00"]],
 ["A","INFANTIL PREFERENTE MALLORCA",["CE Sa Pobla",1,5,0,RS],["CD Artà",0,NS,"12:30"]],
 ["B","INFANTIL PRIMERA REGIONAL MALLORCA",["CD Binissalem",0,2,2,RS],["CE Campos",1,NS,"11:00"]],
 ["A","INFANTIL SUB 13 DIVISIÓN DE HONOR MALLORCA",["CD Collerense",1,1,0,RS],["CD Escolar",0,NS,"10:00"]],
 ["B","INFANTIL SUB 13 PREFERENTE MALLORCA",["CD Muro",1,3,2,RS],["SD Santanyí",0,NS,"09:30"]],
 ["A","ALEVÍN DIVISIÓN DE HONOR MALLORCA",["CE Esporles",0,0,1,RS],["CD Felanitx",1,NS,"11:30"]],
 ["B","ALEVIN 1ª REGIONAL MALLORCA",["CD Manacor",1,6,1,RS],["CE Andratx",0,NS,"10:30"]],
 ["C","ALEVIN 1ª REGIONAL MALLORCA",["CD Pollença",0,2,2,RS],["CD Llosetense",1,NS,"09:00"]],
 ["A","ALEVIN SUB-11 DIVISIÓN DE HONOR MALLORCA",["CD Artà",1,4,3,RS],["CE Sa Pobla",0,NS,"10:00"]],
 ["B","ALEVIN SUB-11 PREFERENTE MALLORCA",["CE Consell",0,1,0,RS],["CD Binissalem",1,NS,"09:30"]],
 ["A","BENJAMÍN PREFERENTE MALLORCA",["CD Escolar",1,2,2,RS],["CE Campos",0,NS,"11:00"]],
 ["B","BENJAMÍN 1ª REGIONAL MALLORCA",["CD Muro",0,3,1,RS],["CD Collerense",1,NS,"10:00"]],
 ["","BENJAMINES SUB-9 PREFERENTE MALLORCA",["SD Santanyí",1,5,4,RS],["CE Esporles",0,NS,"09:00"]],
 ["","PRE BENJAMIN 1ª REGIONAL MALLORCA",["CD Felanitx",0,1,2,RS],["CD Manacor",1,NS,"09:30"]],
 ["","PRE BENJAMIN SUB-7 FEMENINO AUTONOMICA",["CD Pollença",1,2,0,RS],["CE Sa Pobla",0,NS,"10:00"]],
];
const DEFECTO = TUPLAS.map(([l, c, r, p]) => ({ l, c,
  r: { rival: r[0], loc: r[1], a: r[2], b: r[3], f: r[4] },
  p: { rival: p[0], loc: p[1], f: p[2], h: p[3], campo: "" } }));

async function cargar() {
  try { const r = await fetch("datos.json", { cache: "no-store" }); if (!r.ok) return null;
    const d = await r.json(); return Array.isArray(d) && d.length ? d : null; } catch (e) { return null; }
}
const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const fd = iso => { if (!/^\d{4}-\d\d-\d\d$/.test(iso || "")) return iso || "";
  const [y, m, d] = iso.split("-").map(Number);
  return DIAS[new Date(y, m - 1, d).getDay()] + " " + String(d).padStart(2, "0") + "/" + String(m).padStart(2, "0"); };

/* ---------------- PANTALLAS TV ---------------- */
const Titulo = ({ children, sub }) => (
  <div className="flex items-baseline gap-8 mb-6">
    <h2 className="text-[56px] leading-[68px] font-black tracking-tight text-white uppercase">{children}</h2>
    <span className="text-[34px] text-emerald-400 font-semibold">{sub}</span>
  </div>
);
const Etiqueta = ({ e }) => (
  <div className="w-[600px] flex items-center gap-5 shrink-0">
    <div className="w-[64px] h-[64px] rounded-full bg-emerald-500 text-emerald-950 flex items-center justify-center text-[32px] font-black shrink-0">{e.l || "UE"}</div>
    <div className="text-[25px] leading-[30px] font-bold text-white uppercase">{e.c}</div>
  </div>
);
const Fila = ({ children }) => (
  <div className="h-[104px] rounded-[20px] bg-black/55 border-2 border-white/10 flex items-center px-8 gap-5">{children}</div>
);
const Nombre = ({ n, cls }) => (
  <span className={"truncate flex-1 text-[34px] font-bold " + cls + (n === CLUB ? " text-emerald-400" : " text-white")}>{n || "—"}</span>
);
const trozo = (eq, k) => eq.slice(k * POR_PAGINA, (k + 1) * POR_PAGINA);

const Resultados = ({ eq, k, n }) => (
  <div className="fade">
    <Titulo sub={"Última jornada · " + (k + 1) + "/" + n}>Últimos resultados</Titulo>
    <div className="flex flex-col gap-3">
      {trozo(eq, k).map((e, i) => {
        const { rival, loc, a, b, f } = e.r, A = +a || 0, B = +b || 0;
        const gl = loc ? A : B, gv = loc ? B : A;
        const res = A === B ? ["E", "bg-amber-400 text-amber-950"] : A > B ? ["V", "bg-emerald-500 text-emerald-950"] : ["D", "bg-rose-500 text-rose-950"];
        return (
          <Fila key={i}>
            <Etiqueta e={e} />
            <div className="w-[170px] text-[28px] text-slate-400 shrink-0">{fd(f)}</div>
            <Nombre n={loc ? CLUB : rival} cls="text-right" />
            <div className="w-[170px] text-center text-[64px] leading-none font-black text-white tabular-nums shrink-0">{gl}-{gv}</div>
            <Nombre n={loc ? rival : CLUB} cls="text-left" />
            <div className={"w-[64px] h-[64px] rounded-full flex items-center justify-center text-[34px] font-black shrink-0 " + res[1]}>{res[0]}</div>
          </Fila>
        );
      })}
    </div>
  </div>
);

const Proximos = ({ eq, k, n }) => (
  <div className="fade">
    <Titulo sub={"Fin de semana · " + (k + 1) + "/" + n}>Próximos partidos</Titulo>
    <div className="flex flex-col gap-3">
      {trozo(eq, k).map((e, i) => {
        const { rival, loc, f, h, campo } = e.p;
        return (
          <Fila key={i}>
            <Etiqueta e={e} />
            <div className="w-[190px] leading-tight shrink-0">
              <div className="text-[52px] font-black text-white tabular-nums">{h}</div>
              <div className="text-[24px] text-slate-400">{fd(f)}</div>
            </div>
            <div className="flex-1 min-w-0 flex items-center gap-4">
              <span className={"px-4 py-1 rounded-full text-[22px] font-black uppercase shrink-0 " + (loc ? "bg-emerald-500 text-emerald-950" : "bg-slate-600 text-white")}>{loc ? "Local" : "Visit."}</span>
              <span className="truncate text-[34px] font-bold text-white">{rival || "—"}</span>
            </div>
            <div className="w-[400px] text-[26px] leading-tight text-slate-300 flex items-center gap-3">
              <span className="text-[30px]">📍</span><span>{campo || (loc ? CAMPO_CASA : "Camp de " + (rival || "").replace(/^(CD|CE|SD) /, ""))}</span>
            </div>
          </Fila>
        );
      })}
    </div>
  </div>
);

function App({ eq }) {
  const N = Math.max(1, Math.ceil(eq.length / POR_PAGINA));
  const slides = [...Array.from({ length: N }, (_, k) => ({ t: "r", k })), ...Array.from({ length: N }, (_, k) => ({ t: "p", k }))];
  const [i, setI] = useState(0);
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setI(x => (x + 1) % slides.length), 20000); return () => clearInterval(t); }, [slides.length]);
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const s = slides[i % slides.length];
  return (
    <div className="pitch w-[1920px] h-[1080px] relative text-white overflow-hidden">
      <header className="h-[120px] px-[60px] flex items-center justify-between bg-black/60 border-b-4 border-emerald-500">
        <div className="flex items-center gap-6">
          <div className="w-[76px] h-[76px] rounded-full bg-emerald-500 text-emerald-950 flex items-center justify-center text-[36px] font-black">UE</div>
          <div className="text-[52px] font-black tracking-wide uppercase">Unió Esportiva Alcúdia</div>
        </div>
        <div className="flex items-center gap-10">
          <div className="flex gap-4">
            {[["r", "Resultados"], ["p", "Próximos"]].map(([t, nm]) => (
              <div key={t} className={"px-6 py-2 rounded-full text-[26px] font-bold " + (t === s.t ? "bg-emerald-500 text-emerald-950" : "bg-white/10 text-slate-400")}>{nm}</div>
            ))}
          </div>
          <div className="text-[56px] font-black tabular-nums">{now.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}</div>
        </div>
      </header>
      <main className="h-[948px] px-[60px] pt-[36px] overflow-hidden">
        {s.t === "r" ? <Resultados key={i} eq={eq} k={s.k} n={N} /> : <Proximos key={i} eq={eq} k={s.k} n={N} />}
      </main>
      <div className="absolute left-0 bottom-0 h-[12px] w-full bg-white/10"><div key={i} className="bar h-full bg-emerald-500"></div></div>
    </div>
  );
}

/* ---------------- EDITOR (enlace + #editar) ---------------- */
const cls = "mt-1 w-full rounded-lg bg-slate-800 border border-slate-600 px-3 py-2 text-lg text-white";
const In = ({ label, ...p }) => <label className="block text-sm font-semibold text-slate-300">{label}<input {...p} className={cls} /></label>;
const Sel = ({ label, children, ...p }) => <label className="block text-sm font-semibold text-slate-300">{label}<select {...p} className={cls}>{children}</select></label>;

function Editor({ inicial }) {
  const [eq, setEq] = useState(inicial);
  const [est, setEst] = useState("");
  const set = (i, k, f, v) => setEq(q => q.map((e, j) => j === i ? { ...e, [k]: { ...e[k], [f]: v } } : e));
  const rivales = [...new Set(eq.flatMap(e => [e.r.rival, e.p.rival]).filter(Boolean))].sort();
  const guardar = async () => {
    setEst("Guardando…");
    try {
      const a = await claude.use("artifact"); if (!a) throw { code: "no_disponible" };
      await a.publish({ "datos.json": { content: JSON.stringify(eq), contentType: "application/json" } });
      setEst("✅ Guardado. La TV se actualiza sola en unos segundos.");
    } catch (e) { setEst("❌ No se pudo guardar (" + ((e && e.code) || "error") + "). Solo puede guardar quien tiene permiso de edición."); }
  };
  const Btn = () => <button onClick={guardar} className="rounded-xl bg-emerald-500 text-emerald-950 font-black px-6 py-3 text-lg">Guardar y publicar en la TV</button>;
  return (
    <div className="min-h-screen bg-slate-900 text-white">
      <div className="sticky top-0 z-10 bg-slate-950 border-b border-emerald-600 px-4 py-3 flex items-center gap-4 flex-wrap">
        <div className="font-black text-xl">⚽ Editar datos · UE Alcúdia</div>
        <div className="ml-auto"><Btn /></div>
        <div className="w-full text-sm text-slate-300 min-h-[20px]">{est}</div>
      </div>
      <datalist id="rivales">{rivales.map(r => <option key={r} value={r} />)}</datalist>
      <div className="max-w-5xl mx-auto p-4 space-y-4">
        {eq.map((e, i) => (
          <div key={i} className="rounded-2xl bg-slate-800/70 border border-slate-700 p-4">
            <div className="font-black text-emerald-400 mb-3">{(e.l ? e.l + " · " : "") + e.c}</div>
            <div className="text-xs uppercase text-slate-400 mb-1">Último resultado</div>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
              <In label="Rival" list="rivales" value={e.r.rival} onChange={ev => set(i, "r", "rival", ev.target.value)} />
              <Sel label="Jugó" value={e.r.loc ? 1 : 0} onChange={ev => set(i, "r", "loc", +ev.target.value)}><option value={1}>En casa</option><option value={0}>Fuera</option></Sel>
              <In label="Goles Alcúdia" type="number" min="0" value={e.r.a} onChange={ev => set(i, "r", "a", Math.max(0, +ev.target.value || 0))} />
              <In label="Goles rival" type="number" min="0" value={e.r.b} onChange={ev => set(i, "r", "b", Math.max(0, +ev.target.value || 0))} />
              <In label="Fecha" type="date" value={e.r.f} onChange={ev => set(i, "r", "f", ev.target.value)} />
            </div>
            <div className="text-xs uppercase text-slate-400 mb-1">Próximo partido</div>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              <In label="Rival" list="rivales" value={e.p.rival} onChange={ev => set(i, "p", "rival", ev.target.value)} />
              <Sel label="Juega" value={e.p.loc ? 1 : 0} onChange={ev => set(i, "p", "loc", +ev.target.value)}><option value={1}>En casa</option><option value={0}>Fuera</option></Sel>
              <In label="Día" type="date" value={e.p.f} onChange={ev => set(i, "p", "f", ev.target.value)} />
              <In label="Hora" type="time" value={e.p.h} onChange={ev => set(i, "p", "h", ev.target.value)} />
              <In label="Campo (opcional)" placeholder="Automático" value={e.p.campo || ""} onChange={ev => set(i, "p", "campo", ev.target.value)} />
            </div>
          </div>
        ))}
        <div className="text-center pb-8"><Btn /></div>
      </div>
    </div>
  );
}

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = document.getElementById("stage");
  st.style.transform = "scale(" + s + ")";
  st.style.left = (innerWidth - 1920 * s) / 2 + "px";
  st.style.top = (innerHeight - 1080 * s) / 2 + "px";
}
if (EDIT) {
  document.documentElement.style.cssText = "height:auto;overflow:auto";
  document.body.style.cssText = "height:auto;overflow:auto";
  document.getElementById("stage").style.cssText = "position:static;width:auto;height:auto";
} else { addEventListener("resize", fit); fit(); setTimeout(() => location.reload(), 900000); }
cargar().then(d => ReactDOM.createRoot(document.getElementById("root")).render(EDIT ? <Editor inicial={d || DEFECTO} /> : <App eq={d || DEFECTO} />));
</script>
</body>
</html>
